<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Global Politicos Wordle!</title>

<style>
:root {
  --bg: #eaf6ff;
  --tile: #f6fbff;

  --border: #cfe6f7;

  --absent: #d6dde3;   /* soft cool grey-blue */
--present: #f3c6a8;
--correct: #7fd1b9;  /* soft mint teal */

  --text: #3a4b57;
  --accent: #7fb3d5;
}

body {
  font-family: "Segoe UI", system-ui, sans-serif;
  margin: 0;
  padding: 0;

  background: linear-gradient(
    135deg,
    #e3f2fd,
    #d6ecff,
    #cfe8ff
  );

  color: var(--text);
  text-align: center;
}
  body::before {
  content: "";
  position: fixed;
  top: -20%;
  left: -20%;
  width: 140%;
  height: 140%;

  background: radial-gradient(
    circle at 30% 20%,
    rgba(255,255,255,0.45),
    transparent 60%
  );

  pointer-events: none;
}

h1 {
  margin-top: 20px;
  letter-spacing: 2px;
}
#play-again {
  margin-top: 10px;
  padding: 8px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--tile);
  color: var(--text);
  cursor: pointer;
  font-size: 0.9rem;

  transition: all 0.2s ease;
}

#play-again:hover {
  background: #f3d6e2;
  transform: scale(1.05);
}

#theme-select {
  margin-top: 10px;
  padding: 6px 12px;

  border-radius: 10px;
  border: 1px solid var(--border);

  background: linear-gradient(
    135deg,
    #f6fbff,
    #e3f2fd
  );

  color: var(--text);

  font-weight: 500;
  cursor: pointer;

  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;

  transition: 0.2s ease;
}

#theme-select:hover {
  background: #e3f2fd;
}


#game-board {
  display: grid;
  gap: 8px;
  justify-content: center;
  margin: 8px auto;
}

.row {
  display: grid;
  gap: 8px;
  justify-content: center;
}


.tile {
  width: min(65px, 16vw);
  height: min(65px, 16vw);
  border: 2px solid var(--border);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.7),
    0 2px 6px rgba(0,0,0,0.05);
  background: var(--tile);
  font-size: 2em;
  display: flex;
  align-items: center;
  justify-content: center;
  text-transform: uppercase;
  border-radius: 10px;
  letter-spacing: 1.85px;

  transform-style: preserve-3d;
  backface-visibility: hidden;
}


.pop { animation: pop 0.15s ease; }

@keyframes pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}


.flip {
  animation: flip 0.6s ease-in-out forwards;
}

@keyframes flip {
  0% { transform: rotateX(0); }
  50% { transform: rotateX(90deg); }
  100% { transform: rotateX(0); }
}


.correct { background: var(--correct); }
.absent { background: var(--absent); }
.key.absent { background: var(--absent); }
/* KEYBOARD */

#keyboard {
  display: grid;
  grid-template-rows: repeat(3, auto);
  gap: 6px;
  margin: 15px auto;
  max-width: 500px;
  justify-content: center;
}

.key-row {
  display: flex;
  justify-content: center;
  gap: 6px;
  width: 100%;
}

.key {
  padding: 10px 12px;
  background: var(--tile);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  min-width: 32px;
  user-select: none;
}

.correct { background: var(--correct); }
.present { background: var(--present); }
.absent { background: var(--absent); }

.key.correct { background: var(--correct); }
.key.present { background: var(--present); }
.key.absent { background: var(--absent); }

.key.wide {
  min-width: 60px;
}

#message {
  opacity: 0;
  transition: opacity 0.5s ease;
  margin-top: 10px;
}
#message.show {
  opacity: 1;
}


#credit-box {
  position: fixed;
  bottom: 12px;
  right: 12px;
  background: rgba(255,250,245,0.7);
  backdrop-filter: blur(6px);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px 10px;
  font-size: 0.8rem;
}
</style>
</head>

<body>

<h1>IB GLOBALES POLITICOS WORDLE</h1>

<p id="message"></p>

const themes = {
  general: ["power","state","media","civil","order","ethic","local","trust", "mayor", "chief", "annex", "clash", "house", "union", "rally", "elect", "siege", "troop", "globe"],
  countries: ["sudan","syria","india","china","japan","spain","italy","niger","kenya","egypt","libya"],
  rights: ["right","human","court","judge","equal","voice","claim","truth"],
  peace: ["peace","force","crime","treat","chaos"]
};

const keyboardLayout = [
  ["q","w","e","r","t","y","u","i","o","p"],
  ["a","s","d","f","g","h","j","k","l"],
  ["enter","z","x","c","v","b","n","m","⌫"]
];
  
let currentTheme = "general";
let answer = "";
let rows = 6;
let cols = 5;

let currentRow = 0;
let currentCol = 0;
let gameOver = false;

const board = document.getElementById("game-board");

  function createKeyboard() {

  const keyboard = document.getElementById("keyboard");
  keyboard.innerHTML = "";

  keyboardLayout.forEach(row => {

    const rowDiv = document.createElement("div");
    rowDiv.classList.add("key-row");

    for (let key of row) {

      const btn = document.createElement("div");

      btn.classList.add("key");

      if (key === "enter") {
        btn.textContent = "ENTER";
        btn.classList.add("wide");
      }

      else if (key === "⌫") {
        btn.textContent = "⌫";
        btn.classList.add("wide");
      }

      else {
        btn.textContent = key;
      }

      btn.dataset.key = key;

      btn.addEventListener("click", () => {

        if (gameOver) return;

        if (key === "enter") return checkRow();

        if (key === "⌫") return removeLetter();

        addLetter(key);
      });

      rowDiv.appendChild(btn);
    }

    keyboard.appendChild(rowDiv);
  });
}

function startGame() {
  board.innerHTML = "";
  createKeyboard();
  gameOver = false;
  currentRow = 0;
  currentCol = 0;

  const words = themes[currentTheme];
  answer = words[Math.floor(Math.random() * words.length)];
  cols = answer.length;

  for (let r = 0; r < rows; r++) {
    const row = document.createElement("div");
    row.classList.add("row");
    row.style.gridTemplateColumns = `repeat(${cols}, min(65px, 16vw))`;

    for (let c = 0; c < cols; c++) {
      const tile = document.createElement("div");
      tile.classList.add("tile");
      row.appendChild(tile);
    }

    board.appendChild(row);
  }
}

// SWITCH THEME
document.getElementById("theme-select").addEventListener("change", (e) => {
  currentTheme = e.target.value;
  startGame();
});

// INPUT
window.addEventListener("keydown", (e) => {
  if (gameOver) return;

  if (e.key === "Backspace") return removeLetter();
  if (e.key === "Enter") return checkRow();
  if (/^[a-zA-Z]$/.test(e.key)) addLetter(e.key);
});

function addLetter(letter) {
  if (currentCol >= cols) return;

  const tile = board.children[currentRow].children[currentCol];
  tile.textContent = letter;
  tile.classList.add("pop");

  setTimeout(() => tile.classList.remove("pop"), 150);
  currentCol++;
}

function removeLetter() {
  if (currentCol === 0) return;

  currentCol--;
  board.children[currentRow].children[currentCol].textContent = "";
}

// CHECK
function checkRow() {
  if (currentCol !== cols) return;

  const row = board.children[currentRow];
  let guess = "";

  for (let tile of row.children) guess += tile.textContent;
  guess = guess.toLowerCase();

  const validWords = [...dictionary, ...Object.values(themes).flat()];

  if (!validWords.includes(guess)) {
    showMessage("not a valid word 😡");
    return;
  }

  let result = Array(cols).fill("absent");
  let answerArr = answer.split("");

  // correct
  for (let i = 0; i < cols; i++) {
    if (guess[i] === answer[i]) {
      result[i] = "correct";
      answerArr[i] = null;
    }
  }

  // present
  // present
for (let i = 0; i < cols; i++) {

  if (result[i] === "correct") continue;

  // only allow highlight if remaining unused letters exist
  const remainingMatches =
    answer.split("").filter(
      (letter, idx) =>
        letter === guess[i] &&
        result[idx] !== "correct"
    ).length;

  const alreadyMarked =
    result.filter(
      (status, idx) =>
        guess[idx] === guess[i] &&
        (status === "correct" || status === "present")
    ).length;

  if (remainingMatches > alreadyMarked) {
    result[i] = "present";
  }
}
  
  // animate
  for (let i = 0; i < cols; i++) {
    const tile = row.children[i];

    setTimeout(() => {
      tile.classList.add("flip");
      tile.classList.add(result[i]);
      updateKeyboardColor(guess[i], result[i]);
    }, i * 250);
  }

  if (guess === answer) {
    setTimeout(() => {
      showMessage("YOU WON!!!!11!1!1!!! 🎉"); // or answer message
gameOver = true;
document.getElementById("play-again").style.display = "inline-block";
    }, cols * 250);
    return;
  }

  currentRow++;
  currentCol = 0;

  if (currentRow === rows) {
    setTimeout(() => {
      showMessage(`you lost 😂😂 answer was ${answer}`);
      gameOver = true;
      document.getElementById("play-again").style.display = "inline-block";
    }, cols * 250);
  }
}

  
// MESSAGE
function showMessage(text) {
  const msg = document.getElementById("message");
  msg.textContent = text;
  msg.classList.add("show");

  setTimeout(() => msg.classList.remove("show"), 6000);
}

  function updateKeyboardColor(letter, status) {

  const key = document.querySelector(
    `.key[data-key="${letter}"]`
  );

  if (!key) return;

  // priority: correct > present > absent

  if (key.classList.contains("correct")) return;

  if (status === "correct") {

    key.classList.remove("present", "absent");
    key.classList.add("correct");

  }

  else if (status === "present") {

    if (!key.classList.contains("present"))
      key.classList.add("present");

  }

  else if (status === "absent") {

    if (
      !key.classList.contains("correct") &&
      !key.classList.contains("present")
    ) {
      key.classList.add("absent");
    }

  }
}
  
startGame();

  document.getElementById("play-again").addEventListener("click", () => {
  document.getElementById("play-again").style.display = "none";
  document.getElementById("message").classList.remove("show");
  startGame();
});
</script>
